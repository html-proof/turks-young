services:
  - type: web
    name: soundwaves-api
    runtime: python
    rootDir: Songlist
    buildCommand: pip install --root-user-action=ignore -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free

    envVars:
      - key: LOG_LEVEL
        value: INFO

      - key: CORS_ALLOW_ORIGINS
        value: "*"

      - key: FIREBASE_PROJECT_ID
        value: music-hub-d7489

      - key: FIREBASE_DATABASE_URL
        value: https://music-hub-d7489-default-rtdb.firebaseio.com

      - key: FIREBASE_APP_NAME
        value: songlist-backend

      # Upload service_account.json as a Render Secret File →
      # it gets mounted at /etc/secrets/service_account.json
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service_account.json

      # ── Upstash Redis (set token value in Render UI, not here) ────────────
      # ── Supabase PostgreSQL ───────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false   # set securely in Render dashboard (contains password)

      # ── Upstash Redis (set token value in Render UI, not here) ────────────
      - key: UPSTASH_REDIS_REST_URL
        value: https://humorous-horse-160323.upstash.io

      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false   # Render will prompt you to enter the token securely

      # ── Upstream tuning ───────────────────────────────────────────────────
      - key: UPSTREAM_TIMEOUT
        value: "5"

      - key: UPSTREAM_MAX_RETRIES
        value: "2"

      - key: CB_FAILURE_THRESHOLD
        value: "5"

      - key: CB_RECOVERY_TIMEOUT
        value: "30"

      - key: CB_WINDOW
        value: "60"

      # ── Cache TTLs ────────────────────────────────────────────────────────
      - key: TTL_SONG
        value: "21600"

      - key: TTL_ALBUM
        value: "21600"

      - key: TTL_ARTIST
        value: "21600"

      - key: TTL_PLAYLIST
        value: "3600"

      - key: TTL_SEARCH
        value: "900"

      - key: TTL_CHARTS
        value: "600"

      - key: TTL_TRENDING
        value: "600"

      - key: TTL_NEW_RELEASES
        value: "900"

      - key: TTL_SIMILAR
        value: "3600"

      # Backend-owned onboarding catalogue. The Flutter app contains no
      # built-in language choices and renders an empty/retry state if omitted.
      - key: MUSIC_LANGUAGES_JSON
        value: '[{"id":"english","name":"English","native_name":"English"},{"id":"hindi","name":"Hindi","native_name":"हिन्दी"},{"id":"tamil","name":"Tamil","native_name":"தமிழ்"},{"id":"telugu","name":"Telugu","native_name":"తెలుగు"},{"id":"bengali","name":"Bengali","native_name":"বাংলা"},{"id":"marathi","name":"Marathi","native_name":"मराठी"},{"id":"kannada","name":"Kannada","native_name":"ಕನ್ನಡ"},{"id":"malayalam","name":"Malayalam","native_name":"മലയാളം"}]'
