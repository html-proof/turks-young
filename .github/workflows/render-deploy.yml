name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    # The deploy URL is a credential.  It must be stored as a GitHub Actions
    # secret, never committed into this workflow.
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Call Render Deploy Hook
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK repository secret is not configured."
            exit 1
          fi

          echo "Triggering Render deploy hook..."
          STATUS=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --request POST "$RENDER_DEPLOY_HOOK")

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Render deployment successfully triggered."
          else
            echo "Render deploy hook returned HTTP $STATUS. Rotate the hook in Render and update the RENDER_DEPLOY_HOOK secret."
            exit 1
          fi
