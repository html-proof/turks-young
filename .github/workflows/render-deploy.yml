name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Call Render Deploy Hook
        run: |
          echo "Triggering Render deploy hook..."
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST "https://api.render.com/deploy/srv-da6t7i8u01pc73dn1p30?key=3Mg_FWIFqfg")
          STATUS=$(echo "$RESP" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESP" | grep -v "HTTP_STATUS")
          echo "Render API Response: $BODY"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Render deployment successfully triggered!"
          else
            echo "❌ Render deploy hook returned status $STATUS"
            exit 1
          fi
