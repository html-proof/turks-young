name: Keep Render Service Awake

on:
  # 1. Scheduled cron trigger: runs every 10 minutes (Render sleep threshold is 15 min)
  schedule:
    - cron: '*/10 * * * *'
  # 2. Git push trigger: runs whenever any commit is pushed to main
  push:
    branches:
      - main
  # 3. Manual dispatch trigger: allows manual trigger from GitHub Actions dashboard
  workflow_dispatch:
    inputs:
      service_url:
        description: 'Render Service URL to ping (optional, overrides default)'
        required: false
        default: ''

jobs:
  ping-render:
    name: Keep Alive Ping
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Keep-Alive Pings
        env:
          CUSTOM_URL: ${{ github.event.inputs.service_url }}
          SECRET_URL: ${{ secrets.RENDER_SERVICE_URL }}
          VAR_URL: ${{ vars.RENDER_SERVICE_URL }}
          DEFAULT_URL: "https://turks-young.onrender.com"
        run: |
          TARGET_URL="${CUSTOM_URL:-${SECRET_URL:-${VAR_URL:-$DEFAULT_URL}}}"
          TARGET_URL="${TARGET_URL%/}"
          
          echo "====================================================="
          echo "  Render Keep-Alive Git & Cron Trigger"
          echo "  Timestamp : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  Target    : ${TARGET_URL}"
          echo "  Trigger   : ${{ github.event_name }}"
          echo "====================================================="
          
          # 1. Ping /health (wakes up web server & FastAPI application)
          HEALTH_URL="${TARGET_URL}/health"
          echo "Pinging ${HEALTH_URL}..."
          HEALTH_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" \
            --connect-timeout 25 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            -A "GitHub-Actions-Render-KeepAlive/2.0" \
            "${HEALTH_URL}")
          
          H_STATUS=$(echo "$HEALTH_RESP" | grep "HTTP_STATUS" | cut -d':' -f2)
          H_TIME=$(echo "$HEALTH_RESP" | grep "TIME_TOTAL" | cut -d':' -f2)
          echo "-> /health status: ${H_STATUS} (${H_TIME})"
          
          # 2. Ping /health/db (keeps Supabase PgBouncer connection pool warm & active)
          DB_URL="${TARGET_URL}/health/db"
          echo "Pinging ${DB_URL}..."
          DB_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" \
            --connect-timeout 25 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 3 \
            -A "GitHub-Actions-Render-KeepAlive/2.0" \
            "${DB_URL}")
          
          DB_STATUS=$(echo "$DB_RESP" | grep "HTTP_STATUS" | cut -d':' -f2)
          DB_TIME=$(echo "$DB_RESP" | grep "TIME_TOTAL" | cut -d':' -f2)
          echo "-> /health/db status: ${DB_STATUS} (${DB_TIME})"
          
          # Evaluate overall health
          if [ "$H_STATUS" -ge 200 ] && [ "$H_STATUS" -lt 400 ]; then
            echo "✅ Keep-alive ping succeeded! Render instance is fully awake and active."
          else
            echo "⚠️ Main health ping returned $H_STATUS. Testing root fallback..."
            ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${TARGET_URL}/")
            if [ "$ROOT_STATUS" -ge 200 ] && [ "$ROOT_STATUS" -lt 400 ]; then
              echo "✅ Root ping succeeded with HTTP $ROOT_STATUS."
            else
              echo "❌ Render service ping failed with HTTP $ROOT_STATUS"
              exit 1
            fi
          fi
