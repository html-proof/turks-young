name: Keep Render Server Awake

on:
  schedule:
    # Render free services sleep after inactivity; leave margin for delayed jobs.
    - cron: "3/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping lightweight Render health endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL repository secret is not configured."
            exit 1
          fi

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 45 \
            --connect-timeout 15 \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$RENDER_HEALTH_URL")

          echo "Render health endpoint returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi
